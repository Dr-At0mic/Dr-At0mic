<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="End of transmission. Schema to production. Zero hallucinations.">
<style>
.sun{transform-box:fill-box;transform-origin:center bottom;animation:sunrise 3.2s cubic-bezier(0.16, 1, 0.3, 1) .3s both}
.end{animation:rise 1.6s cubic-bezier(0.16, 1, 0.3, 1) .9s both}
@keyframes sunrise{from{opacity:0;transform:scale(.4,.2)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
  <clipPath id="frame"><rect width="1200" height="170" rx="14"/></clipPath>
  <radialGradient id="sun" cx="600" cy="134" r="420" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 134) scale(1 0.32) translate(-600 -134)">
    <stop offset="0" stop-color="#0c0b0a" stop-opacity="0.35"/><stop offset="0.25" stop-color="#3d3832" stop-opacity="0.12"/><stop offset="1" stop-color="#3d3832" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="limb" x1="0" x2="1"><stop offset="0" stop-color="#0b5cad" stop-opacity="0"/><stop offset="0.5" stop-color="#0b5cad" stop-opacity="0.9"/><stop offset="1" stop-color="#0b5cad" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="170" fill="#f3f1ec"/>
  <ellipse class="sun" cx="600" cy="134" rx="420" ry="134" fill="url(#sun)"/>
  <circle cx="600" cy="2534" r="2400" fill="#e4e1d9"/>
  <circle cx="600" cy="2534" r="2400" fill="none" stroke="url(#limb)" stroke-width="2"/>
  <g class="end" text-anchor="middle">
    <text x="606" y="62" font-family="'Helvetica Neue', 'Segoe UI', ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-weight="300" font-size="22" letter-spacing="12" fill="#14161c">END OF TRANSMISSION</text>
    <text x="600" y="90" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.5" fill="#5a6070">@DR-AT0MIC  ·  SCHEMA TO PRODUCTION. ZERO HALLUCINATIONS.</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="1199" height="169" rx="14" fill="none" stroke="#d6d9df"/>
</svg>